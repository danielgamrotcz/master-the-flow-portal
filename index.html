<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Denní přehled diskuzí komunity Master the Flow &mdash; anonymizovaný, přehledný, prohledávatelný.">
  <title>Master the Flow — komunita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <header id="site-header">
      <div class="header-top">
        <div>
          <div class="site-title">Master the Flow</div>
          <div id="header-date" class="site-date">načítám…</div>
        </div>
        <div id="live-badge" class="live-badge hidden">
          <span class="live-dot"></span>
          <span id="live-count">0 poznatků</span>
        </div>
      </div>

      <div class="level-tabs" role="tablist" aria-label="Filtrovat podle úrovně">
        <button class="level-tab active" data-level="all" role="tab" aria-selected="true">Vše</button>
        <button class="level-tab" data-level="Začátečník" role="tab" aria-selected="false">Začátečník</button>
        <button class="level-tab" data-level="Builder" role="tab" aria-selected="false">Builder</button>
        <button class="level-tab" data-level="Expert" role="tab" aria-selected="false">Expert</button>
      </div>

      <div id="topic-chips" class="topic-chips" role="group" aria-label="Filtrovat podle tématu">
        <button class="chip active" data-topic="all">Vše</button>
      </div>
    </header>

    <main id="main-content">

      <div id="view-today" class="view">
        <div id="cards-today" class="cards-grid"></div>
        <div id="loading-today" class="loading-state">
          <div class="spinner"></div>
        </div>
        <div id="empty-today" class="empty-state hidden">
          <p>Dnešní digest zatím nevyšel. Vypadá v 5&nbsp;:&nbsp;15.</p>
        </div>
      </div>

      <div id="view-archive" class="view hidden">
        <div id="archive-header" class="archive-header">
          <div id="archive-date-grid" class="archive-date-grid"></div>
        </div>
        <div id="cards-archive" class="cards-grid"></div>
        <div id="loading-archive" class="loading-state hidden">
          <div class="spinner"></div>
        </div>
        <div id="empty-archive" class="empty-state hidden">
          <p>Pro tento den nejsou žádné záznamy.</p>
        </div>
      </div>

      <div id="view-search" class="view hidden">
        <div class="search-wrapper">
          <input id="search-input" class="search-input" type="search"
            placeholder="Hledat v archivu…" autocomplete="off" autocorrect="off"
            spellcheck="false" enterkeyhint="search">
        </div>
        <div id="search-hint" class="search-hint">Zadejte aspoň 2 znaky</div>
        <div id="cards-search" class="cards-grid hidden"></div>
        <div id="empty-search" class="empty-state hidden">
          <p>Žádné výsledky.</p>
        </div>
        <div id="loading-search" class="loading-state hidden">
          <div class="spinner"></div>
        </div>
      </div>

      <div id="view-transcript" class="view hidden">
        <div id="transcript-back" class="transcript-back">
          <button class="back-btn" id="btn-transcript-back">← Zpět</button>
          <span id="transcript-date-label"></span>
        </div>
        <div id="transcript-content" class="transcript-content"></div>
      </div>

    </main>

    <nav class="bottom-nav" role="navigation" aria-label="Hlavní navigace">
      <button class="nav-btn active" data-view="today" aria-label="Dnes">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <span>Dnes</span>
      </button>
      <button class="nav-btn" data-view="archive" aria-label="Archiv">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Archiv</span>
      </button>
      <button class="nav-btn" data-view="search" aria-label="Hledat">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Hledat</span>
      </button>
    </nav>

  </div>

  <div id="card-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="overlay-backdrop" id="overlay-backdrop"></div>
    <div class="overlay-sheet">
      <div class="overlay-handle"></div>
      <div class="overlay-header">
        <div id="overlay-meta" class="overlay-meta"></div>
        <button id="overlay-close" class="overlay-close-btn" aria-label="Zavřít">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="overlay-body" class="overlay-body"></div>
      <div class="overlay-footer">
        <button id="btn-share" class="btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" y1="2" x2="12" y2="15"/>
          </svg>
          Sdílet
        </button>
        <button id="btn-show-transcript" class="btn-ghost">Přepis dne →</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
