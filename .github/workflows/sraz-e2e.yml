name: Sraz E2E

on:
  pull_request:
    paths:
      - "sraz/**"
      - "skupinky/**"
      - "functions/**"
      - "fonts/**"
      - "_headers"
      - "_redirects"
      - "wrangler.toml"
      - "tests/_auth.js"
      - "tests/e2e-sraz.js"
      - "tests/sraz-asset-versions.js"
      - "tests/archived-groups.js"
      - ".github/workflows/sraz-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "sraz/**"
      - "skupinky/**"
      - "functions/**"
      - "fonts/**"
      - "_headers"
      - "_redirects"
      - "wrangler.toml"
      - "tests/_auth.js"
      - "tests/e2e-sraz.js"
      - "tests/sraz-asset-versions.js"
      - "tests/archived-groups.js"
      - ".github/workflows/sraz-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sraz-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Public meetup page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MTF_BASE: http://127.0.0.1:8788
      PLAYWRIGHT_VERSION: 1.61.0
      WRANGLER_VERSION: 4.91.0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify meetup asset versions
        run: node tests/sraz-asset-versions.js

      - name: Install isolated test tools
        shell: bash
        run: |
          npm install \
            --prefix "$RUNNER_TEMP/mtf-sraz-ci" \
            --no-save \
            --no-package-lock \
            --no-audit \
            --no-fund \
            "playwright@$PLAYWRIGHT_VERSION" \
            "wrangler@$WRANGLER_VERSION"
          "$RUNNER_TEMP/mtf-sraz-ci/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run meetup checks against local Pages server
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/mtf-sraz-ci/node_modules
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/mtf-sraz-ci/node_modules/.bin/wrangler" pages dev . --port 8788 \
            > "$RUNNER_TEMP/mtf-sraz-wrangler.log" 2>&1 &
          wrangler_pid=$!
          trap 'kill "$wrangler_pid" 2> /dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$MTF_BASE/sraz/" > /dev/null; then
              break
            fi
            if ! kill -0 "$wrangler_pid" 2> /dev/null; then
              cat "$RUNNER_TEMP/mtf-sraz-wrangler.log"
              exit 1
            fi
            if [[ "$attempt" == 60 ]]; then
              cat "$RUNNER_TEMP/mtf-sraz-wrangler.log"
              exit 1
            fi
            sleep 1
          done

          if ! node tests/e2e-sraz.js || ! node tests/archived-groups.js; then
            cat "$RUNNER_TEMP/mtf-sraz-wrangler.log"
            exit 1
          fi
